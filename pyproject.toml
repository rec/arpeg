[project]
name = "arpeg"
version = "0.2.0"
description = "🧬 An expressive arpeggiator 🧬"
readme = "README.md"
authors = [
    { name = "Tom Ritchford", email = "tom@swirly.com" }
]
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "pydantic>=2.13.5",
    "tyro>=1.0.16",
    "ufor",
]

[project.optional-dependencies]
envelfo = [
    "envelfo",
]
midi = [
    "mido>=1.3.3",
    "python-rtmidi>=1.5.8",
]

[project.scripts]
arpeg-python = "arpeg.midi:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mido>=1.3.3",
    "pytest>=9.1.1",
    "pyupgrade>=3.21.2",
    "ruff>=0.16.9",
    "ty>=0.0.84",
    "envelfo",
]

[tool.uv.sources]
ufor = { git = "ssh://git@github.com/rec/ufor.git", branch = "main" }
envelfo = { git = "ssh://git@github.com/rec/envelfo.git", rev = "a9213ce9d99602866022339975ae5469e7784985" }
