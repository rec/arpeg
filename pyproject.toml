[project]
name = "arpeg"
version = "0.1.0"
description = "🧬 An expressive arpeggiator 🧬"
readme = "README.md"
authors = [
    { name = "Tom Ritchford", email = "tom@swirly.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.5",
    "ufor",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyupgrade>=3.21.2",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.uv.sources]
ufor = { git = "ssh://git@github.com/rec/ufor.git", rev = "main" }
