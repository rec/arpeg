[project]
name = "arpeg"
version = "0.1.0"
description = "🧬 An expressive arpeggiator 🧬"
readme = "README.md"
authors = [
    { name = "Tom Ritchford", email = "tom@swirly.com" }
]
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "mido>=1.3.3",
    "pydantic>=2.13.5",
    "tyro>=1.0.16",
    "ufor",
]

[project.optional-dependencies]
midi = [
    "python-rtmidi>=1.5.8",
]

[project.scripts]
arpeg-python = "arpeg.midi:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyupgrade>=3.21.2",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.uv.sources]
ufor = { git = "ssh://git@github.com/rec/ufor.git", rev = "main" }
