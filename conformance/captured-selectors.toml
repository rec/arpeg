# All cases capture C, E, G with distinct breath, attack and release velocities.
# The first nonempty opportunity is absolute grid step 1, at beat 1/4.

[[cases]]
name = "transition-cycle"
selection = {kind = "transition", weights = [[0, 1, 0], [0, 0, 1], [1, 0, 0]], missing_weight = 0}
keys = [60, 64, 67, 60]
beats = ["1/4", "1/2", "3/4", "1"]

[[cases]]
name = "blocked-transition-retains-source"
selection = {kind = "transition", weights = [[0, 0, 0]], missing_weight = 0}
keys = [60]
beats = ["1/4"]

[[cases]]
name = "interval-ranges-follow-absolute-step"
selection = {kind = "interval_envelope", ranges = [{min = 1, max = 1}, {min = -1, max = -1}]}
keys = [60, 64, 60, 64]
beats = ["1/4", "1/2", "3/4", "1"]

[[cases]]
name = "interval-rest-recovers-on-next-range"
selection = {kind = "interval_envelope", ranges = [{min = -1, max = -1}, {min = 1, max = 1}], boundary = "rest"}
keys = [60, 64, 60]
beats = ["1/4", "3/4", "1"]

[[cases]]
name = "grammar-expands-once-before-captured-playback"
selection = {kind = "grammar", axiom = ["A"], rules = {A = ["A", "B"], B = ["A"]}, terminals = {A = 0, B = 1}, rounds = 3}
keys = [60, 64, 60, 60]
beats = ["1/4", "1/2", "3/4", "1"]

[[cases]]
name = "grammar-outside-rank-rests"
selection = {kind = "grammar", axiom = ["A", "X", "B"], terminals = {A = 0, X = 4, B = 1}, boundary = "rest"}
keys = [60, 64, 60]
beats = ["1/4", "3/4", "1"]

[[cases]]
name = "grammar-addresses-expanded-octave-ranks"
selection = {kind = "grammar", axiom = ["A", "B"], terminals = {A = 3, B = 1}}
octaves = {offsets = [0, 1]}
keys = [72, 64, 72, 64]
beats = ["1/4", "1/2", "3/4", "1"]

[[cases]]
name = "zero-accent-does-not-advance-transition"
selection = {kind = "transition", weights = [[0, 1, 0], [0, 0, 1], [1, 0, 0]], missing_weight = 0}
patterns = {accents = [1, 0, 1]}
keys = [60, 64]
beats = ["1/2", "3/4"]
