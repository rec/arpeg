[[cases]]
name = "history capture remains in microseconds through tempo and transport changes"
profile = "history-wind"
mode = "internal"
actions = [
  { at = 0, data = [176, 2, 0], beat = "0", active = true, output = [] },
  { at = 0, data = [144, 60, 100], beat = "0", active = true, output = [] },
  { at = 15625, data = [176, 2, 80], beat = "1/32", active = true, output = [] },
  { at = 62500, data = [128, 60, 20], beat = "1/8", active = true, output = [] },
  { at = 125000, beat = "1/4", active = true, output = [[176, 2, 0], [144, 60, 100]] },
  { at = 125000, tempo = 60, beat = "1/4", active = true, output = [] },
  { at = 175000, beat = "3/10", active = true, output = [[176, 2, 80]] },
  { at = 200000, data = [252], beat = "13/40", active = false, output = [[128, 60, 0]] },
  { at = 220000, data = [144, 67, 90], beat = "13/40", active = false, output = [] },
  { at = 240000, data = [128, 67, 0], beat = "13/40", active = false, output = [] },
  { at = 300000, data = [251], beat = "13/40", active = true, output = [] },
  { at = 475000, beat = "1/2", active = true, output = [[176, 2, 0], [144, 60, 100]] },
  { at = 525000, beat = "11/20", active = true, output = [[176, 2, 80]] },
  { at = 675000, beat = "7/10", active = true, output = [[128, 60, 20]] },
  { at = 725000, beat = "3/4", active = true, output = [[176, 2, 80], [144, 67, 90]] },
]

[[cases]]
name = "separate clock input excludes notes and note input excludes transport"
profile = "up"
mode = "external"
actions = [
  { at = 0, data = [250], source = "notes", beat = "0", active = false, output = [] },
  { at = 0, data = [144, 70, 100], source = "clock", beat = "0", active = false, output = [] },
  { at = 0, data = [144, 60, 100], source = "notes", beat = "0", active = false, output = [] },
  { at = 0, data = [250], source = "clock", beat = "0", active = false, output = [] },
  { at = 0, data = [248], source = "clock", beat = "0", active = true, output = [] },
  { at = 0, beat = "0", active = true, output = [[144, 60, 100]] },
  { at = 10000, data = [248], source = "clock", beat = "1/24", active = true, output = [] },
  { at = 510000, beat = "1/12", active = false, output = [[128, 60, 0]] },
]
