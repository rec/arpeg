# Each action checks wire output, exact beat position, and acquired clock state.
[[cases]]
name = "internal tempo, pause, continue, restart and seek"
profile = "up"
mode = "internal"
actions = [
  { at = 0, data = [144, 60, 100], beat = "0", active = true, output = [] },
  { at = 0, data = [144, 64, 90], beat = "0", active = true, output = [] },
  { at = 0, beat = "0", active = true, output = [[144, 60, 100]] },
  { at = 50000, tempo = 60, beat = "1/10", active = true, output = [] },
  { at = 150000, beat = "1/5", active = true, output = [[128, 60, 0]] },
  { at = 200000, beat = "1/4", active = true, output = [[144, 64, 90]] },
  { at = 210000, data = [252], beat = "13/50", active = false, output = [[128, 64, 0]] },
  { at = 210001, data = [128, 60, 0], beat = "13/50", active = false, output = [] },
  { at = 500000, data = [251], beat = "13/50", active = true, output = [] },
  { at = 740000, beat = "1/2", active = true, output = [[144, 64, 90]] },
  { at = 750000, data = [250], beat = "0", active = true, output = [[128, 64, 0]] },
  { at = 750000, beat = "0", active = true, output = [[144, 64, 90]] },
  { at = 760000, data = [242, 10, 0], beat = "5/2", active = true, output = [[128, 64, 0]] },
  { at = 760000, beat = "5/2", active = true, output = [[144, 64, 90]] },
]

