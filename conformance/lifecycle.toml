# Actual output lifecycle, independent of rhythm admission notifications.
[[cases]]
name = "handoff-stale-release-pause-and-clear"
profile = "live-wind"
actions = [
  { at = 0, data = [144, 60, 100], output = [], notes = [] },
  { at = 0, output = [[144, 60, 100]], notes = [["0", "note_start", 0, "input:0", 60, 100]] },
  { at = 125000, output = [[128, 60, 0], [144, 60, 100]], notes = [["1/4", "note_end", 0, "input:0", 60, 0], ["1/4", "note_start", 1, "input:0", 60, 100]] },
  { at = 187500, output = [], notes = [] },
  { at = 200000, stop = true, output = [[128, 60, 0]], notes = [["2/5", "note_end", 1, "input:0", 60, 0]] },
  { at = 210000, stop = true, output = [], notes = [] },
  { at = 250000, data = [251], output = [], notes = [] },
  { at = 300000, output = [[144, 60, 100]], notes = [["1/2", "note_start", 2, "input:0", 60, 100]] },
  { at = 310000, clear = true, output = [[128, 60, 0]], notes = [["13/25", "note_end", 2, "input:0", 60, 0]] },
]

[[cases]]
name = "zero-gate-pairs-start-and-end-at-the-same-beat"
profile = "lifecycle-zero"
actions = [
  { at = 0, data = [144, 60, 100], output = [], notes = [] },
  { at = 0, output = [[144, 60, 100], [128, 60, 0]], notes = [["0", "note_start", 0, "input:0", 60, 100], ["0", "note_end", 0, "input:0", 60, 0]] },
  { at = 125000, output = [[144, 60, 100], [128, 60, 0]], notes = [["1/4", "note_start", 1, "input:0", 60, 100], ["1/4", "note_end", 1, "input:0", 60, 0]] },
]

[[cases]]
name = "repeats-have-distinct-occurrences-and-exact-subdivisions"
profile = "lifecycle-repeats"
actions = [
  { at = 0, data = [144, 60, 100], output = [], notes = [] },
  { at = 0, output = [[144, 60, 100], [128, 60, 0]], notes = [["0", "note_start", 0, "input:0", 60, 100], ["0", "note_end", 0, "input:0", 60, 0]] },
  { at = 83334, output = [[144, 60, 100], [128, 60, 0], [144, 60, 100], [128, 60, 0]], notes = [["1/12", "note_start", 1, "input:0", 60, 100], ["1/12", "note_end", 1, "input:0", 60, 0], ["1/6", "note_start", 2, "input:0", 60, 100], ["1/6", "note_end", 2, "input:0", 60, 0]] },
]

[[cases]]
name = "seek-and-empty-bank-end-only-the-owned-occurrence"
profile = "up"
actions = [
  { at = 0, data = [144, 60, 100], output = [], notes = [] },
  { at = 0, output = [[144, 60, 100]], notes = [["0", "note_start", 0, "input:0", 60, 100]] },
  { at = 50000, data = [242, 4, 0], output = [[128, 60, 0]], notes = [["1", "note_end", 0, "input:0", 60, 0]] },
  { at = 50000, output = [[144, 60, 100]], notes = [["1", "note_start", 1, "input:0", 60, 100]] },
  { at = 60000, data = [128, 60, 0], output = [[128, 60, 0]], notes = [["51/50", "note_end", 1, "input:0", 60, 0]] },
]

[[cases]]
name = "captured-note-release-retains-velocity-and-source-identity"
profile = "phrase-wind"
actions = [
  { at = 0, capture = "record", output = [], notes = [] },
  { at = 0, data = [144, 60, 100], output = [], notes = [] },
  { at = 10000, data = [128, 60, 20], output = [], notes = [] },
  { at = 20000, capture = "commit", output = [], notes = [] },
  { at = 125000, output = [[144, 60, 100]], notes = [["1/4", "note_start", 0, "take-0:note-0", 60, 100]] },
  { at = 225000, output = [[128, 60, 20]], notes = [["9/20", "note_end", 0, "take-0:note-0", 60, 20]] },
  { at = 250000, output = [[144, 60, 100]], notes = [["1/2", "note_start", 1, "take-0:note-0", 60, 100]] },
  { at = 260000, clear = true, output = [[128, 60, 0]], notes = [["13/25", "note_end", 1, "take-0:note-0", 60, 0]] },
]
