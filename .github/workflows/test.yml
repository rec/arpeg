name: Release builds and tests

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable: arpeg
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            executable: arpeg.exe
          - os: macos-15
            target: aarch64-apple-darwin
            executable: arpeg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: arpeg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - name: Install Linux MIDI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Install Python with MIDI support
        # Read the public SSH-pinned dependency over HTTPS without an SSH key.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: ssh://git@github.com/
        run: uv sync --frozen --extra midi
      - name: Test Python reference and host message handling
        run: uv run --frozen --extra midi pytest
      - name: Check Python
        run: uv run --frozen --extra midi ruff check --select B,E,F,I arpeg test tools
      - name: Check Python formatting
        run: uv run --frozen --extra midi ruff format --check arpeg test tools
      - name: Check Python types
        run: uv run --frozen --extra midi ty check arpeg tools
      - name: Test Rust core and MIDI host
        run: cargo test --workspace --locked
      - name: Build native executable
        run: cargo build -p arpeg-midi --release --locked
      - name: Validate a profile with the standalone executable
        shell: bash
        run: |
          "./target/release/${{ matrix.executable }}" validate conformance/up.toml
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Check Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Package standalone executable
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: uv run --frozen --extra midi python tools/package_native.py --version "$RELEASE_TAG" --target "${{ matrix.target }}" --binary "target/release/${{ matrix.executable }}" --output dist/native
      - name: Retain native downloads
        uses: actions/upload-artifact@v7
        with:
          name: arpeg-native-${{ matrix.target }}
          path: dist/native/
          if-no-files-found: error

  publish-native:
    needs: [test, wasm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: arpeg-native-*
          merge-multiple: true
          path: dist/native
      - name: Attach native downloads to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/native/* --repo "$GITHUB_REPOSITORY"

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.87.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install matching WebAssembly tools
        shell: bash
        run: |
          curl -fL https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz -o "$RUNNER_TEMP/wasm-bindgen.tar.gz"
          tar -xzf "$RUNNER_TEMP/wasm-bindgen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Test core, portable MIDI player, and browser bindings in WebAssembly
        run: cargo test --workspace --no-default-features --target wasm32-unknown-unknown --tests --locked
      - name: Build browser instrument and module
        run: node web/build.mjs
      - name: Test generated web bindings and instrument timing
        run: node --test crates/arpeg-wasm/tests/browser.mjs web/test/music.mjs web/test/synth.mjs
      - name: Upload browser module and bindings
        uses: actions/upload-artifact@v7
        with:
          name: arpeg-webassembly
          path: dist/wasm/
          if-no-files-found: error
      - name: Upload playable browser instrument
        uses: actions/upload-artifact@v7
        with:
          name: arpeg-web-instrument
          path: dist/web/
          if-no-files-found: error
