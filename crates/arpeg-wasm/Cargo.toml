[package]
name = "arpeg-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arpeg-core = { path = "../arpeg-core" }
arpeg-midi = { path = "../arpeg-midi", default-features = false }
js-sys = "0.3.106"
midly = { version = "0.5.3", default-features = false, features = ["std"] }
wasm-bindgen = "=0.2.129"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.79"
